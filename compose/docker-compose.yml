networks:
  frontend:
  backend:

volumes:
  pgdata:
  opdata:
  ollama:

x-op-restart-policy: &restart_policy
  restart: unless-stopped

x-op-image: &op_image
  image: openproject/openproject:${OPENPROJECT_TAG:-17-slim}

x-op-app: &op_app
  <<: [*op_image, *restart_policy]
  environment:
    OPENPROJECT_HTTPS: "${OPENPROJECT_HTTPS:-false}"
    OPENPROJECT_HOST__NAME: "${OPENPROJECT_HOST__NAME:-127.0.0.1:8080}"
    OPENPROJECT_ADDITIONAL__HOST__NAMES: "${OPENPROJECT_ADDITIONAL__HOST__NAMES:-localhost,web}"
    OPENPROJECT_HSTS: "${OPENPROJECT_HSTS:-false}"
    OPENPROJECT_RAILS__CACHE__STORE: "memcache"
    OPENPROJECT_CACHE__MEMCACHE__SERVER: "cache:11211"
    OPENPROJECT_RAILS__RELATIVE__URL__ROOT: "${OPENPROJECT_RAILS__RELATIVE__URL__ROOT:-}"
    OPENPROJECT_COLLABORATIVE__EDITING__HOCUSPOCUS__URL: "${COLLABORATIVE_SERVER_URL:-ws://127.0.0.1:8080/hocuspocus}"
    OPENPROJECT_COLLABORATIVE__EDITING__HOCUSPOCUS__SECRET: "${COLLABORATIVE_SERVER_SECRET:-change-me-collab-secret}"
    DATABASE_URL: "${DATABASE_URL}"
    RAILS_MIN_THREADS: "${RAILS_MIN_THREADS:-4}"
    RAILS_MAX_THREADS: "${RAILS_MAX_THREADS:-16}"
    IMAP_ENABLED: "${IMAP_ENABLED:-false}"
    SECRET_KEY_BASE: "${SECRET_KEY_BASE}"
  volumes:
    - "${OPDATA:-opdata}:/var/openproject/assets"
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  db:
    image: postgres:${POSTGRES_VERSION:-17}
    <<: *restart_policy
    stop_grace_period: 3s
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:-openproject}"
    volumes:
      - "${PGDATA:-pgdata}:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend

  cache:
    image: memcached:1.6-alpine
    <<: *restart_policy
    networks:
      - backend

  seeder:
    <<: *op_app
    command: "./docker/prod/seeder"
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
    networks:
      - backend

  web:
    <<: *op_app
    command: "./docker/prod/web"
    hostname: "${OPENPROJECT_HOST__NAME:-127.0.0.1:8080}"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
      seeder:
        condition: service_completed_successfully
    ports:
      - "${PORT:-127.0.0.1:8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080${OPENPROJECT_RAILS__RELATIVE__URL__ROOT:-}/health_checks/default"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - frontend
      - backend

  worker:
    <<: *op_app
    command: "./docker/prod/worker"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
      seeder:
        condition: service_completed_successfully
    networks:
      - backend

  cron:
    <<: *op_app
    command: "./docker/prod/cron"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
      seeder:
        condition: service_completed_successfully
    networks:
      - backend

  hocuspocus:
    image: openproject/hocuspocus:17.6.0
    <<: *restart_policy
    environment:
      SECRET: "${COLLABORATIVE_SERVER_SECRET:-change-me-collab-secret}"
      OPENPROJECT_URL: "${OPENPROJECT_URL:-http://web:8080}"
      OPENPROJECT_HTTPS: "${OPENPROJECT_HTTPS:-false}"
    depends_on:
      web:
        condition: service_started
    networks:
      - backend
      - frontend

  proxy:
    image: caddy:2.9-alpine
    <<: *restart_policy
    profiles:
      - proxy
    ports:
      - "${PROXY_PORT:-127.0.0.1:8081}:80"
    volumes:
      - ../config/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - frontend

  ollama:
    image: ollama/ollama:latest
    <<: *restart_policy
    profiles:
      - ollama-container
    volumes:
      - "${OLLAMA_DATA:-ollama}:/root/.ollama"
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - backend
